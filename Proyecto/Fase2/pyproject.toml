[project]
name = "taller2-rag-ecomarket"
version = "0.1.0"
description = "Agente de IA EcoMarket con RAG y automatizacion de devoluciones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.5",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
]

[tool.setuptools]
py-modules = [
    "app",
    "agent",
    "agent_logger",
    "agent_prompts",
    "agent_tools",
    "model",
    "knowledge_base",
    "rag_engine",
    "prompts",
    "return_service",
    "smoke_agent_check",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
